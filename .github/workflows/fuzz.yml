name: Fuzz

# Daily fuzz run for the cargo-fuzz harnesses under fuzz/. The reusable
# workflow auto-discovers targets from fuzz/fuzz_targets/*.rs and splits
# the 30-minute budget across them:
#
#   * frame_header / compressed_header / decode_frame — panic-surface
#     fuzz over the §6.2 / §6.3 header walkers and the whole decode
#     pipeline (single frame, Annex B split, sequence driver): garbage
#     in, "no panic / no overflow / no OOM" out; Err is a correct
#     answer.
#   * encode_keyframe / encode_lossy_keyframe / encode_lossy_matrix /
#     encode_chained_sequence — oracle-carrying round-trips: a stream
#     the encoder DID emit must decode (byte-exact back to the input
#     on the lossless targets), across fuzz-derived geometries,
#     quantizers, formats (the full §7.2 profile matrix), and content.
#   * decode_tile_parallel_diff — differential oracle over the
#     round-448 tile-parallel path: every input must produce the
#     identical outcome (frames byte-for-byte, or the same error)
#     through the serial walk and the 4-thread tile-column fan-out.
#
# Seed corpus entries (corpus/*/seed-*) are derived from the crate's
# synthetic test vectors and tracked in git; fuzz-grown corpus persists
# across runs via the workflow's actions/cache step.

on:
  schedule:
    - cron: "37 6 * * *"   # daily 06:37 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      time_budget_seconds: 1800
    secrets: inherit
